[env]
# Keep `go install` binaries in the version-independent ~/go/bin (already on PATH)
# instead of mise's per-version installs/go/<ver>/bin, which disappears on version switch.
GOBIN = "{{env.HOME}}/go/bin"

[settings]
experimental = true
trusted_config_paths = ["/home/icholy/src/github.com/compassdigital"]
